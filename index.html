<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Expense Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header>
      <h1>Student Expense Tracker</h1>
      <p>Apna budget aur kharche track karo</p>
    </header>

    <section class="card budget-card">
      <h2>Monthly Budget</h2>
      <form id="budgetForm" class="budget-form">
        <label for="budgetInput">Budget amount (₹)</label>
        <div class="input-row">
          <input
            id="budgetInput"
            type="number"
            min="0"
            step="0.01"
            placeholder="Jaise 5000"
            required
          >
          <button type="submit">Save Budget</button>
        </div>
      </form>
      <p id="budgetMessage" class="message"></p>
    </section>

    <section class="summary-grid">
      <article class="card summary-card">
        <h2>Monthly Budget</h2>
        <p id="budgetTotal">₹0.00</p>
      </article>
      <article class="card summary-card">
        <h2>This Month's Expenses</h2>
        <p id="monthlyTotal">₹0.00</p>
      </article>
      <article class="card summary-card">
        <h2>Remaining</h2>
        <p id="remainingTotal">₹0.00</p>
      </article>
    </section>

    <section class="card">
      <h2>Add an Expense</h2>
      <form id="expenseForm" class="expense-form">
        <div>
          <label for="expenseName">Expense name</label>
          <input id="expenseName" type="text" placeholder="Jaise Lunch" required>
        </div>

        <div>
          <label for="expenseAmount">Amount (₹)</label>
          <input id="expenseAmount" type="number" min="0.01" step="0.01" placeholder="150" required>
        </div>

        <div>
          <label for="expenseCategory">Category</label>
          <select id="expenseCategory" required>
            <option value="">Choose category</option>
            <option value="Food">Food</option>
            <option value="Travel">Travel</option>
            <option value="Study">Study</option>
            <option value="Shopping">Shopping</option>
            <option value="Bills">Bills</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <div>
          <label for="expenseDate">Date</label>
          <input id="expenseDate" type="date" required>
        </div>

        <button type="submit" class="add-button">Add Expense</button>
      </form>
      <p id="expenseMessage" class="message"></p>
    </section>

    <section class="card chart-card">
      <h2>Category-wise Expenses (This Month)</h2>
      <div class="chart-container">
        <canvas id="categoryChart" aria-label="Category-wise expenses chart"></canvas>
      </div>
    </section>

    <section class="card">
      <h2>This Month's Expenses</h2>
      <p id="emptyMessage" class="empty-message">Abhi is month ka koi expense nahi hai.</p>
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Category</th>
              <th>Date</th>
              <th>Amount</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="expenseList"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="script.js"></script>
</body>
</html>
