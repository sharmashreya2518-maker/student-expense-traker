
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>My Expense Tracker</h1>
        <p>Manage your monthly spending smartly!</p>
    </header>

    <main>
        <section>
            <h2>Monthly Budget</h2>

            <form id="budget-form">
                <label for="budget-amount">Set Budget (₹)</label>
                <input
                    type="number"
                    id="budget-amount"
                    min="1"
                    step="0.01"
                    placeholder="e.g. 5000"
                    required
                >
                <button type="submit">Save Budget</button>
            </form>

            <div class="budget-summary">
                <p>Monthly Budget: ₹<span id="budget-display">0.00</span></p>
                <p>Total Spent: ₹<span id="total">0.00</span></p>
                <p>Remaining: ₹<span id="remaining">0.00</span></p>
            </div>

            <div class="progress-track">
                <div id="progress-bar"></div>
            </div>

            <p id="budget-message">Set your budget to get started!</p>
        </section>

        <section>
            <h2>Add New Expense</h2>

            <form id="expense-form">
                <label for="expense-name">Expense Name</label>
                <input
                    type="text"
                    id="expense-name"
                    placeholder="e.g. Hostel food"
                    required
                >

                <label for="expense-amount">Amount (₹)</label>
                <input
                    type="number"
                    id="expense-amount"
                    placeholder="e.g. 100"
                    min="0.01"
                    step="0.01"
                    required
                >

                <label for="category">Category</label>
                <select id="category">
                    <option value="Food">Food</option>
                    <option value="Travel">Travel</option>
                    <option value="Stationery">Stationery</option>
                    <option value="Shopping">Shopping</option>
                    <option value="Other">Other</option>
                </select>

                <button type="submit">Add Expense</button>
            </form>
        </section>

        <section>
            <h2>This Month's Expenses</h2>
            <ul id="expense-list"></ul>
            <p id="empty-message">No expenses added this month yet.</p>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
